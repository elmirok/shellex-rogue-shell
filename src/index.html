<main class="rogue-shell" data-app>
  <section class="game-stage" aria-label="Rogue Shell game">
    <header class="topbar">
      <div>
        <p class="eyebrow">Shellex Vault Game</p>
        <h1>Rogue Shell</h1>
      </div>
      <div class="engine-pill" data-engine-status>Engine idle</div>
    </header>

    <section class="setup-panel" data-setup>
      <div class="setup-copy">
        <p class="eyebrow">Story Seed</p>
        <h2>What kind of run should the vault dream up?</h2>
      </div>
      <textarea data-story-prompt spellcheck="true">A broken moon has fallen into an encrypted archive. I am a scavenger trying to reach the root directory before rival ghosts rewrite the world.</textarea>
      <div class="setup-actions">
        <button type="button" class="primary" data-start>Start Run</button>
        <button type="button" data-load>Load Vault Save</button>
      </div>
    </section>

    <section class="play-layout" data-play hidden>
      <div class="board-shell">
        <div class="board-header">
          <div>
            <p class="eyebrow" data-floor-label>Floor 1</p>
            <h2 data-place-name>Booting dungeon...</h2>
          </div>
          <div class="turn-chip" data-turn>Turn 0</div>
        </div>
        <div class="board" data-board tabindex="0" aria-label="Dungeon map"></div>
        <div class="action-row">
          <button type="button" data-act="up" aria-label="Move up">^</button>
          <button type="button" data-act="left" aria-label="Move left">&lt;</button>
          <button type="button" data-act="down" aria-label="Move down">v</button>
          <button type="button" data-act="right" aria-label="Move right">&gt;</button>
          <button type="button" data-rest>Rest</button>
          <button type="button" data-next-beat>New Beat</button>
        </div>
      </div>

      <aside class="side-panel" aria-label="Run details">
        <section class="stat-strip">
          <div><span>HP</span><strong data-hp>0/0</strong></div>
          <div><span>XP</span><strong data-xp>0</strong></div>
          <div><span>Gold</span><strong data-gold>0</strong></div>
        </section>

        <section class="panel-section">
          <p class="eyebrow">Quest</p>
          <h3 data-quest-title>No quest</h3>
          <p data-quest-copy></p>
        </section>

        <section class="panel-section">
          <p class="eyebrow">Pack</p>
          <ul class="inventory" data-inventory></ul>
        </section>

        <section class="panel-section">
          <p class="eyebrow">Director</p>
          <div class="director-grid">
            <label>
              <span>Provider</span>
              <select data-provider>
                <option value="procedural">Pocket Qwen</option>
                <option value="qwen">Browser Qwen</option>
              </select>
            </label>
            <button type="button" data-warm-qwen>Warm Qwen</button>
          </div>
          <p class="tiny" data-model-note>Model stays asleep until explicitly warmed.</p>
        </section>

        <section class="panel-section log-section">
          <p class="eyebrow">Log</p>
          <ol class="log" data-log></ol>
        </section>
      </aside>
    </section>
  </section>
</main>
<script type="module" src="./app.js" data-dev-only></script>
